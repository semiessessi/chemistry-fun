<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electron Orbital Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top-bar">
<div id="controls">
  <label for="d1-select">Mode</label>
  <select id="d1-select"></select>
  <div id="molecule-row">
    <div id="d2-col">
      <label id="d2-label" for="d2-select">Shell</label>
      <select id="d2-select"></select>
    </div>
    <div id="category-wrapper" class="dropdown-hidden">
      <label for="category-select">Category</label>
      <select id="category-select"></select>
    </div>
  </div>
  <div id="pubchem-wrapper" class="dropdown-hidden">
    <div id="pubchem-search-row">
      <input type="text" id="pubchem-input" placeholder="PubChem: name or CID...">
      <button id="pubchem-btn">Go</button>
    </div>
    <div id="pubchem-status"></div>
  </div>
  <div id="variant-wrapper" class="dropdown-hidden">
    <label id="variant-label" for="variant-select">Variant</label>
    <select id="variant-select"></select>
  </div>
  <label id="d3-label" for="d3-select">Subshell</label>
  <select id="d3-select"></select>
  <div id="d4-wrapper">
    <label id="d4-label" for="d4-select">Orbital</label>
    <select id="d4-select"></select>
  </div>
  <div id="mixer-wrapper" class="dropdown-hidden">
    <label for="mixer-preset">Preset</label>
    <select id="mixer-preset">
      <option value="sp">sp</option>
      <option value="sp2">sp²</option>
      <option value="sp3">sp³</option>
      <option value="custom">Custom</option>
    </select>
    <div id="mixer-sliders"></div>
    <label class="checkbox-row">
      <input type="checkbox" id="mixer-normalize" checked>
      Normalize
    </label>
  </div>
  <label for="prob-slider">Probability Cutoff</label>
  <input type="range" id="prob-slider" min="1" max="99" value="80">
  <div id="prob-display">80%</div>
  <details class="section" open>
    <summary>Ball &amp; Stick</summary>
    <label class="checkbox-row">
      <input type="checkbox" id="ball-stick-toggle" checked>
      Show Model
    </label>
  </details>
  <details class="section" open>
    <summary>Visualization</summary>
    <div id="vis-toggles">
      <label class="checkbox-row">
        <input type="checkbox" id="field-vis-toggle">
        Vector Field
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="density-field-toggle" checked>
        Density Field
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="energy-diagram-toggle">
        Energy Levels
      </label>
    </div>
    <div id="field-options" class="dropdown-hidden">
      <select id="field-source-select">
        <option value="gradient" selected>Gradient (&nabla;&psi; / &nabla;&rho;)</option>
        <option value="electrostatic">Electron Field (&minus;&nabla;&rho;)</option>
        <option value="magnetic">Magnetic (B-field)</option>
      </select>
      <select id="field-style-select">
        <option value="arrows">Arrows</option>
        <option value="streamlines">Streamlines</option>
        <option value="both" selected>Both</option>
      </select>
    </div>
    <div id="density-options">
      <label for="layer-select">Layers</label>
      <select id="layer-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="8">8</option>
        <option value="12">12 (Slow)</option>
        <option value="24">24 (Slow)</option>
        <option value="50">50 (Very Slow)</option>
        <option value="100">100 (Very Slow)</option>
        <option value="custom">Custom...</option>
      </select>
      <div id="custom-layers-row" class="dropdown-hidden">
        <input type="number" id="custom-layers-input" min="1" max="500" value="5" placeholder="Layers">
      </div>
      <label for="opacity-slider">Opacity</label>
      <input type="range" id="opacity-slider" min="5" max="90" value="70">
      <div id="opacity-display">70%</div>
      <div id="color-curve-wrapper" class="dropdown-hidden">
        <label for="color-curve-slider">Color Curve</label>
        <input type="range" id="color-curve-slider" min="1" max="40" value="10" step="1">
        <div id="color-curve-display">1.0 (linear)</div>
      </div>
    </div>
  </details>
  <div id="separation-wrapper" class="dropdown-hidden">
    <label for="sep-slider">Separation</label>
    <input type="range" id="sep-slider" min="0" max="100" value="100" step="1">
    <div id="sep-display">R = 1.401 a₀ (0.741 Å) · E = −4.747 eV</div>
  </div>
  <div id="dynamics-wrapper" class="dropdown-hidden">
    <label>Impact Parameter</label>
    <input type="range" id="dyn-impact" min="0" max="50" value="10">
    <div id="dyn-impact-display">b = 1.0 a&#x2080;</div>
    <label>Approach Speed</label>
    <input type="range" id="dyn-speed" min="1" max="30" value="10">
    <div id="dyn-speed-display">v&#x2080; = 1.0</div>
    <div id="dyn-buttons">
      <button id="dyn-play">&#x25B6; Play</button>
      <button id="dyn-reset">&#x21BA; Reset</button>
    </div>
    <div id="dyn-info"></div>
  </div>
  <div id="vibration-wrapper" class="dropdown-hidden">
    <label for="vib-mode-select">Vibration Mode</label>
    <select id="vib-mode-select">
      <option value="-1">None</option>
    </select>
    <div id="vib-amplitude-group">
      <label for="vib-amplitude">Amplitude</label>
      <input type="range" id="vib-amplitude" min="5" max="100" value="30">
      <div id="vib-amplitude-display">0.30 a&#x2080;</div>
    </div>
    <div id="vib-progress" class="dropdown-hidden">
      <div id="vib-progress-label">Building frame 0/24...</div>
      <div id="vib-progress-track"><div id="vib-progress-fill"></div></div>
    </div>
    <div id="vib-buttons">
      <button id="vib-play" disabled>&#x25B6; Play</button>
    </div>
  </div>
  <div id="transition-wrapper" class="dropdown-hidden">
    <div id="transition-progress" class="dropdown-hidden">
      <div id="transition-progress-label">Building frame 0/24...</div>
      <div id="transition-progress-track"><div id="transition-progress-fill"></div></div>
    </div>
    <div id="transition-buttons">
      <button id="transition-play" disabled>&#x25B6; Play</button>
    </div>
    <div id="spectrum-bar">
      <div id="spectrum-gradient"></div>
      <div id="spectrum-indicator"></div>
      <div id="spectrum-label"></div>
    </div>
  </div>
  <div id="computing">
    <div id="progress-label">Computing...</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
  <div id="pubchem-citation"></div>
  <div id="share-link"></div>
</div>
<div id="layer-key"></div>
<div id="energy-diagram" class="dropdown-hidden"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
